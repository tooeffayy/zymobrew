# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: zymo
          POSTGRES_PASSWORD: zymo
          POSTGRES_DB: zymo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zymo -d zymo" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://zymo:zymo@localhost:5432/zymo?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          cache: true

      - name: Install frontend deps
        working-directory: web
        run: bun install

      - name: Build frontend
        working-directory: web
        run: bun run build

      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5
        with:
          sqlc-version: "1.31.1"

      - name: Verify sqlc generated code is up to date
        run: sqlc diff

      - name: Vet the sqlc statements
        run: sqlc vet

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...

      - name: Build
        run: go build -v ./...
